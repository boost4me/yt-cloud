name: TubeAssistant Cloud

on:
  workflow_dispatch:

jobs:
  tube-assistant:
    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install UV
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Set workspace
        run: |
          echo "YOUTUBE_AI_WORKSPACE=$HOME/.youtube-ai-agent" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.youtube-ai-agent"

      - name: Configure TubeAssistant
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > "$YOUTUBE_AI_WORKSPACE/.env" <<EOF
          AI_SERVICE=openrouter
          OPENROUTER_API_KEY=$OPENROUTER_API_KEY
          OPENROUTER_MODEL=google/gemma-4-31b-it:free
          IMAGE_PROVIDER=pollinations
          PEXELS_API_KEY=$PEXELS_API_KEY
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
          EOF

          touch "$YOUTUBE_AI_WORKSPACE/.setup_done"

      - name: Configure YouTube authentication
        env:
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_CREDENTIALS_JSON" \
            > "$YOUTUBE_AI_WORKSPACE/credentials.json"

          printf '%s' "$YOUTUBE_TOKEN_JSON" \
            > "$YOUTUBE_AI_WORKSPACE/token.json"

      - name: Check configuration
        run: |
          uv tool run \
            --from git+https://github.com/metiu1/tube-assistant.git \
            tube-assistant preflight

      - name: Test OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          response = requests.post(
              "https://openrouter.ai/api/v1/chat/completions",
              headers={
                  "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                  "Content-Type": "application/json",
                  "HTTP-Referer": "tube-assistant",
              },
              json={
                  "model": "google/gemma-4-31b-it:free",
                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply with exactly: OK"
                      }
                  ],
                  "max_tokens": 10,
                  "temperature": 0
              },
              timeout=60,
          )

          if response.status_code != 200:
              print(f"OpenRouter HTTP {response.status_code}")
              print(response.text[:1000])
              raise SystemExit(1)

          data = response.json()
          content = data.get("choices", [{}])[0].get("message", {}).get("content", "")

          if not content:
              print("OpenRouter returned no content.")
              print(response.text[:1000])
              raise SystemExit(1)

          print("OpenRouter test: OK")
          PY

      - name: Generate test video
        run: |
          uv tool run \
            --from git+https://github.com/metiu1/tube-assistant.git \
            tube-assistant dry-run

      - name: Upload generated files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tubeassistant-test-output
          path: /home/runner/.youtube-ai-agent/output/
          if-no-files-found: error
