name: TubeAssistant Cloud

on:
  workflow_dispatch:

jobs:
  tube-assistant:
    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install TubeAssistant
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv tool install git+https://github.com/metiu1/tube-assistant.git

      - name: Check TubeAssistant
        run: |
          tube-assistant preflight
