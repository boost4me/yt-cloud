name: TubeAssistant Cloud

on:
  workflow_dispatch:

jobs:
  tube-assistant:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install UV
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Set workspace
        run: |
          echo "YOUTUBE_AI_WORKSPACE=$HOME/.youtube-ai-agent" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.youtube-ai-agent"

      - name: Install TubeAssistant
        run: |
          uv tool install --force git+https://github.com/metiu1/tube-assistant.git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure TubeAssistant
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > "$YOUTUBE_AI_WORKSPACE/.env" <<EOF
          AI_SERVICE=openrouter
          OPENROUTER_API_KEY=$OPENROUTER_API_KEY
          OPENROUTER_MODEL=openrouter/free
          IMAGE_PROVIDER=pollinations
          PEXELS_API_KEY=$PEXELS_API_KEY
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
          EOF

          touch "$YOUTUBE_AI_WORKSPACE/.setup_done"

      - name: Configure YouTube authentication
        env:
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_CREDENTIALS_JSON" \
            > "$YOUTUBE_AI_WORKSPACE/credentials.json"

          printf '%s' "$YOUTUBE_TOKEN_JSON" \
            > "$YOUTUBE_AI_WORKSPACE/token.json"

      - name: Install OpenRouter compatibility layer
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tubeassistant-runtime"

          cat > "$GITHUB_WORKSPACE/.tubeassistant-runtime/sitecustomize.py" <<'PY'
          import os
          import time
          import requests
          import moduli.ai_client as ai

          OPENROUTER_URL = "https://openrouter.ai/api/v1/chat/completions"

          def patched_openrouter(messages, max_tokens=4096):
              api_key = os.environ.get("OPENROUTER_API_KEY", "").strip()

              if not api_key:
                  raise RuntimeError("OPENROUTER_API_KEY missing")

              prompt_text = "\n".join(
                  str(m.get("content", ""))
                  for m in messages
                  if isinstance(m, dict)
              ).lower()

              wants_json = (
                  "reply only with valid json" in prompt_text
                  or "exact structure:" in prompt_text
                  or (
                      '"title"' in prompt_text
                      and '"description"' in prompt_text
                      and '"script"' in prompt_text
                  )
              )

              headers = {
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "HTTP-Referer": "https://github.com/boost4me/yt-cloud",
                  "X-Title": "TubeAssistant Cloud",
              }

              # Topic generation only requests 64 tokens in TubeAssistant.
              # Free reasoning models can consume that entire budget thinking.
              # Give short non-JSON requests a safer budget.
              effective_max_tokens = max_tokens

              if not wants_json and max_tokens <= 128:
                  effective_max_tokens = 256

              payload = {
                  "model": "openrouter/free",
                  "messages": messages,
                  "max_tokens": effective_max_tokens,
                  "temperature": min(ai._temp(), 0.7),
                  "seed": ai._seed(),
                  "reasoning": {
                      "exclude": True
                  },
              }

              if wants_json:
                  payload["response_format"] = {
                      "type": "json_object"
                  }

              last_error = None

              # Multiple attempts. OpenRouter/free can select different
              # currently-available free models/providers between requests.
              for attempt in range(8):
                  try:
                      response = requests.post(
                          OPENROUTER_URL,
                          headers=headers,
                          json=payload,
                          timeout=180,
                      )

                      if response.status_code == 429:
                          wait = min(10 * (attempt + 1), 60)
                          print(
                              f"[OpenRouter] 429 — waiting {wait}s...",
                              flush=True
                          )
                          time.sleep(wait)
                          continue

                      if response.status_code in (408, 500, 502, 503, 504):
                          wait = min(5 * (attempt + 1), 30)
                          print(
                              f"[OpenRouter] HTTP {response.status_code} "
                              f"— retrying in {wait}s...",
                              flush=True
                          )
                          time.sleep(wait)
                          continue

                      if response.status_code != 200:
                          raise RuntimeError(
                              f"OpenRouter HTTP {response.status_code}: "
                              f"{response.text[:1000]}"
                          )

                      data = response.json()

                      choices = data.get("choices") or []

                      if not choices:
                          last_error = RuntimeError(
                              f"No choices returned: {data}"
                          )
                          time.sleep(3)
                          continue

                      message = choices[0].get("message") or {}
                      content = message.get("content")

                      if content and str(content).strip():
                          print(
                              f"[OpenRouter] Success: "
                              f"{data.get('model', 'unknown')}",
                              flush=True,
                          )
                          return str(content).strip()

                      # Some reasoning models can still return no normal content.
                      # Retry so the router can select another endpoint.
                      finish_reason = choices[0].get("finish_reason")
                      reasoning_tokens = (
                          data.get("usage", {})
                              .get("completion_tokens_details", {})
                              .get("reasoning_tokens", 0)
                      )

                      last_error = RuntimeError(
                          f"empty content; finish_reason={finish_reason}; "
                          f"reasoning_tokens={reasoning_tokens}"
                      )

                      print(
                          f"[OpenRouter] Empty content "
                          f"(finish={finish_reason}, "
                          f"reasoning_tokens={reasoning_tokens}) "
                          f"— retrying...",
                          flush=True
                      )

                      time.sleep(3)

                  except Exception as exc:
                      last_error = exc
                      print(
                          f"[OpenRouter] Attempt {attempt + 1}/8 failed: "
                          f"{exc}",
                          flush=True
                      )

                      if attempt < 7:
                          time.sleep(min(3 * (attempt + 1), 20))

              raise RuntimeError(
                  f"OpenRouter failed after retries: {last_error}"
              )

          # TubeAssistant caches the provider function in _PROVIDERS,
          # so patch both the function and the dispatch table.
          ai._openrouter = patched_openrouter

          if hasattr(ai, "_PROVIDERS"):
              ai._PROVIDERS["openrouter"] = patched_openrouter

          print(
              "[TubeAssistant] OpenRouter compatibility layer enabled",
              flush=True
          )
          PY

      - name: Check configuration
        env:
          PYTHONPATH: ${{ github.workspace }}/.tubeassistant-runtime
        run: |
          tube-assistant preflight

      - name: Generate test video
        env:
          PYTHONPATH: ${{ github.workspace }}/.tubeassistant-runtime
        run: |
          tube-assistant dry-run

      - name: Upload generated files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tubeassistant-test-output
          path: /home/runner/.youtube-ai-agent/output/
          if-no-files-found: error
