name: TubeAssistant Cloud

on:
  workflow_dispatch:

jobs:
  tube-assistant:
    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install TubeAssistant
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv tool install git+https://github.com/metiu1/tube-assistant.git

      - name: Configure TubeAssistant
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p "$HOME/.youtube-ai-agent"

          {
            echo "AI_SERVICE=openrouter"
            echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY"
            echo "OPENROUTER_MODEL=meta-llama/llama-3.3-70b-instruct:free"
            echo "IMAGE_PROVIDER=pollinations"
            echo "PEXELS_API_KEY=$PEXELS_API_KEY"
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID"
          } > "$HOME/.youtube-ai-agent/.env"

          touch "$HOME/.youtube-ai-agent/.setup_done"

      - name: Configure YouTube authentication
        env:
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p "$HOME/.youtube-ai-agent"

          printf '%s' "$YOUTUBE_CREDENTIALS_JSON" \
            > "$HOME/.youtube-ai-agent/credentials.json"

          printf '%s' "$YOUTUBE_TOKEN_JSON" \
            > "$HOME/.youtube-ai-agent/token.json"

      - name: Check configuration
        run: |
          tube-assistant preflight

      - name: Generate test video
        run: |
          tube-assistant dry-run

      - name: Upload generated files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tubeassistant-test-output
          path: /home/runner/.youtube-ai-agent/output/
          if-no-files-found: error
