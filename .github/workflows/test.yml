name: TubeAssistant Cloud

on:
  workflow_dispatch:

jobs:
  tube-assistant:
    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install TubeAssistant
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv tool install git+https://github.com/metiu1/tube-assistant.git

      - name: Configure TubeAssistant
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          mkdir -p "$HOME/.youtube-ai-agent"
          cat > "$HOME/.youtube-ai-agent/.env" <<EOF
          AI_SERVICE=openrouter
          OPENROUTER_API_KEY=$OPENROUTER_API_KEY
          OPENROUTER_MODEL=meta-llama/llama-3.3-70b-instruct:free
          IMAGE_PROVIDER=pollinations
          PEXELS_API_KEY=$PEXELS_API_KEY
          EOF

      - name: Configure YouTube authentication
        env:
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p "$HOME/.youtube-ai-agent"
          printf '%s' "$YOUTUBE_CREDENTIALS_JSON" > "$HOME/.youtube-ai-agent/credentials.json"
          printf '%s' "$YOUTUBE_TOKEN_JSON" > "$HOME/.youtube-ai-agent/token.json"

      - name: Check configuration
        run: |
          tube-assistant preflight
                - name: Get Telegram chat ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import json

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          url = f"https://api.telegram.org/bot{token}/getUpdates"

          data = json.load(urllib.request.urlopen(url))

          for update in data.get("result", []):
              message = update.get("message")
              if message:
                  chat = message.get("chat", {})
                  print("CHAT_ID:", chat.get("id"))
          PY
