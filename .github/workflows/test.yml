name: TubeAssistant Cloud

on:
  workflow_dispatch:

jobs:
  tube-assistant:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install UV
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Set workspace
        run: |
          echo "YOUTUBE_AI_WORKSPACE=$HOME/.youtube-ai-agent" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.youtube-ai-agent"

      - name: Install TubeAssistant
        run: |
          uv tool install --force git+https://github.com/metiu1/tube-assistant.git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create OpenRouter fallback
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tubeassistant-runtime"

          cat > "$GITHUB_WORKSPACE/.tubeassistant-runtime/sitecustomize.py" <<'PY'
          import time
          import requests
          import os

          import moduli.ai_client as ai

          MODELS = [
              "google/gemma-4-26b-a4b-it:free",
              "mistralai/mistral-small-3.2-24b-instruct:free",
              "qwen/qwen3-next-80b-a3b-instruct:free",
          ]

          ORIGINAL_URL = ai.OPENROUTER_URL

          def openrouter_fallback(messages, max_tokens=4096):
              api_key = os.environ.get("OPENROUTER_API_KEY", "").strip()

              if not api_key:
                  raise RuntimeError("OPENROUTER_API_KEY missing in .env")

              headers = {
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "HTTP-Referer": "https://github.com/boost4me/yt-cloud",
                  "X-Title": "TubeAssistant Cloud",
              }

              last_error = None

              for model in MODELS:
                  for attempt in range(2):
                      try:
                          response = requests.post(
                              ORIGINAL_URL,
                              headers=headers,
                              json={
                                  "model": model,
                                  "messages": messages,
                                  "max_tokens": max_tokens,
                                  "temperature": ai._temp(),
                                  "seed": ai._seed(),
                                  "reasoning": {
                                      "enabled": False
                                  },
                              },
                              timeout=180,
                          )

                          if response.status_code == 200:
                              data = response.json()
                              choices = data.get("choices") or []

                              if choices:
                                  message = choices[0].get("message") or {}
                                  content = message.get("content")

                                  if content and content.strip():
                                      print(
                                          f"[OpenRouter] SUCCESS: {data.get('model', model)}",
                                          flush=True,
                                      )
                                      return content.strip()

                              last_error = RuntimeError(
                                  f"{model}: HTTP 200 but empty content"
                              )
                              print(
                                  f"[OpenRouter] {model}: empty content; trying next model",
                                  flush=True,
                              )
                              break

                          last_error = RuntimeError(
                              f"{model}: HTTP {response.status_code}: "
                              f"{response.text[:500]}"
                          )

                          print(
                              f"[OpenRouter] {model}: HTTP {response.status_code}; "
                              f"trying fallback",
                              flush=True,
                          )

                          if response.status_code in (
                              400, 404, 408, 409, 429, 500, 502, 503, 504
                          ):
                              if attempt == 0:
                                  time.sleep(5)
                                  continue
                              break

                          response.raise_for_status()

                      except Exception as exc:
                          last_error = exc
                          print(
                              f"[OpenRouter] {model}: {exc}; trying fallback",
                              flush=True,
                          )

                          if attempt == 0:
                              time.sleep(5)
                              continue

                          break

              raise RuntimeError(
                  f"All OpenRouter models failed: {last_error}"
              )

          # Patch the function itself.
          ai._openrouter = openrouter_fallback

          # IMPORTANT: patch the provider dispatch table too.
          ai._PROVIDERS["openrouter"] = openrouter_fallback

          print(
              "[TubeAssistant] OpenRouter fallback installed correctly",
              flush=True,
          )
          PY

      - name: Configure TubeAssistant
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > "$YOUTUBE_AI_WORKSPACE/.env" <<EOF
          AI_SERVICE=openrouter
          OPENROUTER_API_KEY=$OPENROUTER_API_KEY
          OPENROUTER_MODEL=google/gemma-4-26b-a4b-it:free
          IMAGE_PROVIDER=pollinations
          PEXELS_API_KEY=$PEXELS_API_KEY
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
          EOF

          touch "$YOUTUBE_AI_WORKSPACE/.setup_done"

      - name: Configure YouTube authentication
        env:
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_CREDENTIALS_JSON" \
            > "$YOUTUBE_AI_WORKSPACE/credentials.json"

          printf '%s' "$YOUTUBE_TOKEN_JSON" \
            > "$YOUTUBE_AI_WORKSPACE/token.json"

      - name: Check configuration
        env:
          PYTHONPATH: ${{ github.workspace }}/.tubeassistant-runtime
        run: |
          tube-assistant preflight

      - name: Generate test video
        env:
          PYTHONPATH: ${{ github.workspace }}/.tubeassistant-runtime
        run: |
          tube-assistant dry-run

      - name: Upload generated files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tubeassistant-test-output
          path: /home/runner/.youtube-ai-agent/output/
          if-no-files-found: error
