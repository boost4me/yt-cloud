name: TubeAssistant Cloud

on:
  workflow_dispatch:

jobs:
  tube-assistant:
    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install UV
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Set workspace
        run: |
          echo "YOUTUBE_AI_WORKSPACE=$HOME/.youtube-ai-agent" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.youtube-ai-agent"

      - name: Install TubeAssistant
        run: |
          uv tool install --force git+https://github.com/metiu1/tube-assistant.git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure TubeAssistant
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > "$YOUTUBE_AI_WORKSPACE/.env" <<EOF
          AI_SERVICE=openrouter
          OPENROUTER_API_KEY=$OPENROUTER_API_KEY
          OPENROUTER_MODEL=openrouter/free
          IMAGE_PROVIDER=pollinations
          PEXELS_API_KEY=$PEXELS_API_KEY
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
          EOF

          touch "$YOUTUBE_AI_WORKSPACE/.setup_done"

      - name: Configure YouTube authentication
        env:
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_CREDENTIALS_JSON" \
            > "$YOUTUBE_AI_WORKSPACE/credentials.json"

          printf '%s' "$YOUTUBE_TOKEN_JSON" \
            > "$YOUTUBE_AI_WORKSPACE/token.json"

      - name: Check configuration
        run: |
          tube-assistant preflight

      - name: Test OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import time
          import requests

          api_key = os.environ["OPENROUTER_API_KEY"]

          payload = {
              "model": "openrouter/free",
              "messages": [
                  {
                      "role": "user",
                      "content": "Reply with exactly: OK"
                  }
              ],
              "max_tokens": 10,
              "temperature": 0
          }

          headers = {
              "Authorization": f"Bearer {api_key}",
              "Content-Type": "application/json",
              "HTTP-Referer": "https://github.com/boost4me/yt-cloud",
              "X-Title": "TubeAssistant Cloud"
          }

          last_status = None

          for attempt in range(1, 6):
              response = requests.post(
                  "https://openrouter.ai/api/v1/chat/completions",
                  headers=headers,
                  json=payload,
                  timeout=90
              )

              last_status = response.status_code

              if response.status_code == 200:
                  data = response.json()
                  content = (
                      data.get("choices", [{}])[0]
                      .get("message", {})
                      .get("content", "")
                  )

                  if content:
                      print("OpenRouter test: OK")
                      print("Model used:", data.get("model", "unknown"))
                      raise SystemExit(0)

                  print("OpenRouter returned 200 but no message content.")
                  print(response.text[:1000])
                  raise SystemExit(1)

              print(f"OpenRouter attempt {attempt}/5 returned HTTP {response.status_code}")

              if response.status_code not in (408, 429, 500, 502, 503, 504):
                  print(response.text[:1000])
                  raise SystemExit(1)

              if attempt < 5:
                  time.sleep(attempt * 10)

          print(f"OpenRouter failed after 5 attempts. Last HTTP status: {last_status}")
          print(response.text[:1000])
          raise SystemExit(1)
          PY

      - name: Generate test video
        run: |
          tube-assistant dry-run

      - name: Upload generated files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tubeassistant-test-output
          path: /home/runner/.youtube-ai-agent/output/
          if-no-files-found: error
