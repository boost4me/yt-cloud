name: TubeAssistant Cloud

on:
  workflow_dispatch:

jobs:
  tube-assistant:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install UV
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Set workspace
        run: |
          echo "YOUTUBE_AI_WORKSPACE=$HOME/.youtube-ai-agent" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.youtube-ai-agent"

      - name: Install TubeAssistant
        run: |
          uv tool install --force git+https://github.com/metiu1/tube-assistant.git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure TubeAssistant
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > "$YOUTUBE_AI_WORKSPACE/.env" <<EOF
          AI_SERVICE=openrouter
          OPENROUTER_API_KEY=$OPENROUTER_API_KEY
          OPENROUTER_MODEL=openrouter/free
          IMAGE_PROVIDER=pollinations
          PEXELS_API_KEY=$PEXELS_API_KEY
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
          EOF

          touch "$YOUTUBE_AI_WORKSPACE/.setup_done"

      - name: Configure YouTube authentication
        env:
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_CREDENTIALS_JSON" \
            > "$YOUTUBE_AI_WORKSPACE/credentials.json"

          printf '%s' "$YOUTUBE_TOKEN_JSON" \
            > "$YOUTUBE_AI_WORKSPACE/token.json"

      - name: Install JSON output compatibility patch
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tubeassistant-runtime"

          cat > "$GITHUB_WORKSPACE/.tubeassistant-runtime/sitecustomize.py" <<'PY'
          import os
          import requests

          import moduli.ai_client as ai

          ORIGINAL_URL = ai.OPENROUTER_URL

          def patched_openrouter(messages, max_tokens=4096):
              api_key = os.environ.get("OPENROUTER_API_KEY", "").strip()

              if not api_key:
                  raise RuntimeError("OPENROUTER_API_KEY missing in .env")

              headers = {
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "HTTP-Referer": "https://github.com/boost4me/yt-cloud",
                  "X-Title": "TubeAssistant Cloud",
              }

              text = "\n".join(
                  str(m.get("content", ""))
                  for m in messages
                  if isinstance(m, dict)
              ).lower()

              wants_json = (
                  "reply only with valid json" in text
                  or "exact structure:" in text
                  or '"title"' in text
                  and '"description"' in text
                  and '"script"' in text
              )

              payload = {
                  "model": os.environ.get(
                      "OPENROUTER_MODEL",
                      "openrouter/free"
                  ),
                  "messages": messages,
                  "max_tokens": max_tokens,
                  "temperature": ai._temp(),
                  "seed": ai._seed(),
              }

              if wants_json:
                  payload["response_format"] = {
                      "type": "json_object"
                  }

              response = requests.post(
                  ORIGINAL_URL,
                  headers=headers,
                  json=payload,
                  timeout=180,
              )

              if response.status_code == 429:
                  raise RuntimeError(
                      "OpenRouter rate-limited the request (HTTP 429)."
                  )

              response.raise_for_status()

              data = response.json()
              choices = data.get("choices") or []

              if not choices:
                  raise RuntimeError(
                      f"OpenRouter returned no choices: {data}"
                  )

              message = choices[0].get("message") or {}
              content = message.get("content")

              if not content:
                  raise RuntimeError(
                      f"OpenRouter returned empty content: {data}"
                  )

              return content.strip()

          ai._openrouter = patched_openrouter

          if hasattr(ai, "_PROVIDERS"):
              ai._PROVIDERS["openrouter"] = patched_openrouter

          print(
              "[TubeAssistant] OpenRouter JSON compatibility patch enabled",
              flush=True,
          )
          PY

      - name: Check configuration
        env:
          PYTHONPATH: ${{ github.workspace }}/.tubeassistant-runtime
        run: |
          tube-assistant preflight

      - name: Generate test video
        env:
          PYTHONPATH: ${{ github.workspace }}/.tubeassistant-runtime
        run: |
          tube-assistant dry-run

      - name: Upload generated files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tubeassistant-test-output
          path: /home/runner/.youtube-ai-agent/output/
          if-no-files-found: error
